services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: project-brand-new-day:vm
    container_name: project-brand-new-day
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:?error}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?error}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?error}
      AUTH_TRUST_HOST: "true"
